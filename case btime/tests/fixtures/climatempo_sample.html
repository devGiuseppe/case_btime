<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Climatempo - Mock Match</title>
</head>
<body>
    <div class="weather-display-container">
        <!-- Status do HP térmico do mapa -->
        <div class="parameter-temperature">
            <span class="value">26°</span>
        </div>
        
        <!-- Umidade do spray -->
        <div class="parameter-humidity">
            <span class="value">58%</span>
        </div>
        
        <!-- Vento / Boost de velocidade -->
        <div class="parameter-wind">
            <span class="value">10 km/h</span>
        </div>
        
        <!-- Condição / Bombsite status -->
        <div class="parameter-condition">
            <span class="value">Sol com nuvens na B</span>
        </div>
    </div>
</body>
</html>
